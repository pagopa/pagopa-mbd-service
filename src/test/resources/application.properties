# Info
info.application.artifactId=@project.artifactId@
info.application.name=@project.name@
info.application.version=@project.version@
info.application.description=@project.description@
info.properties.environment=test
# Server
server.servlet.context-path=/
server.port=8080
server.shutdown=GRACEFUL
# logging
logging.level.root=INFO
logging.level.it.gov.pagopa=DEBUG
# CORS configuration
cors.configuration={"origins": ["*"], "methods": ["*"]}
#Client
mbd.link.baseUrl=http://localhost:8080
mbd.client.demandPayment.endpoint=http://localhost:8086/demand
mbd.client.cart.endpoint=http://localhost:8086/v1/cart
mbd.client.cart.v2.endpoint=http://localhost:8086/v2/cart
mbd.client.paymentReceipt.endpoint=http://localhost:8086/receipt/payments/%s/receipts/%s
mbd.client.demandPayment.subscriptionKey=
mbd.client.cart.subscriptionKey=
mbd.client.cart.v2.subscriptionKey=
mbd.client.paymentReceipt.subscriptionKey=
mbd.mapper.idPsp=ABI50004
mbd.mapper.idBrokerPsp=99999000011
mbd.mapper.channelId=99999000011_03
# Openapi
springdoc.swagger-ui.enabled=true
springdoc.use-fqn=false
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
springdoc.api-docs.groups.enabled=true
springdoc.group-configs[0].group=v1
springdoc.group-configs[0].displayName=Marca da Bollo Digitale v1
springdoc.group-configs[0].paths-to-match=/v1/**,/info
springdoc.group-configs[1].group=v2
springdoc.group-configs[1].displayName=Marca da Bollo Digitale v2
springdoc.group-configs[1].paths-to-match=/v2/**,/info